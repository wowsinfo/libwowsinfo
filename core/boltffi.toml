[package]
name = "wowsinfo_core"
crate = "wowsinfo_core"
version = "0.1.0"
repository = "https://github.com/wowsinfo/libwowsinfo"
license = "MIT"

[targets.apple]
output = "../ios/generated/Shared"
include_macos = true

[targets.apple.swift]
module_name = "WowsInfoCore"

[targets.apple.spm]
package_name = "WowsInfoCore"
layout = "ffi-only"

[targets.android]
output = "../android/generated"
min_sdk = 34

[targets.android.kotlin]
package = "com.wowsinfo.libwowsinfo"
output = "../android/generated/kotlin"

[targets.android.pack]
output = "../android/generated/jniLibs"

