[package]
name = "wowsinfo_core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "lib", "staticlib"]
name = "wowsinfo_core"

[[bin]]
name = "codegen"
required-features = ["codegen"]

[features]
default = ["facet_typegen"]
facet_typegen = ["crux_core/facet_typegen"]
codegen = [
    "dep:anyhow",
    "dep:clap",
    "dep:log",
    "dep:pretty_env_logger",
    "facet_typegen",
]

[dependencies]
crux_core = { version = "0.20", features = ["facet_typegen", "testing"] }
crux_http = { version = "0.20", features = ["facet_typegen"] }
crux_kv = { version = "0.14", features = ["facet_typegen"] }
crux_time = { version = "0.18", features = ["facet_typegen"] }
boltffi = "0.29"
facet = "0.46"
serde.workspace = true
serde_json.workspace = true

# Optional codegen-only dependencies
anyhow = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
log = { workspace = true, optional = true }
pretty_env_logger = { workspace = true, optional = true }

[build-dependencies]
